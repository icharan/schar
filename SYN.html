<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNOP Gmail Sender</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fa;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            color: blue;
            margin-bottom: 25px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        button {
            padding: 16px 8px;
            border: none;
            border-radius: 7px;
            background: green;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: black;
        }

        .ppbb-button {
            background: #388e3c;
        }

        .ppbb-button:hover {
            background: #1b5e20;
        }

        .report-button {
            background: #1565c0;
        }

        .report-button:hover {
            background: #0d47a1;
        }

        .synop-pilot-button {
            background: #8e24aa;
        }

        .synop-pilot-button:hover {
            background: #6a1b9a;
        }

        .upper-air-button {
            background: #ef6c00;
        }

        .upper-air-button:hover {
            background: #e65100;
        }

        .footer {
            position: fixed;
            right: 15px;
            bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            color: blue;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            .buttons {
                grid-template-columns: 1fr;
            }

            .footer {
                font-size: 14px;
                right: 10px;
                bottom: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>SYNOP Gmail Sender</h2>

    <div class="buttons">

        <button onclick="openGmail('00')">00Z</button>
        <button onclick="openGmail('03')">03Z</button>
        <button onclick="openGmail('06')">06Z</button>
        <button onclick="openGmail('09')">09Z</button>
        <button onclick="openGmail('12')">12Z</button>
        <button onclick="openGmail('15')">15Z</button>
        <button onclick="openGmail('18')">18Z</button>
        <button onclick="openGmail('21')">21Z</button>

        <button class="ppbb-button" onclick="openPPBB('06')">
            06Z LOW CLOUDS
        </button>

        <button class="ppbb-button" onclick="openPPBB('18')">
            18Z NO LANTERNS
        </button>

        <button class="synop-pilot-button" onclick="openSynopPilot('06')">
            06Z & PILOT
        </button>

        <button class="synop-pilot-button" onclick="openSynopPilot('18')">
            18Z & PILOT
        </button>

        <button class="report-button" onclick="openDailyWeatherParameters()">
            DAILY WEATHER PARAMETERS
        </button>

        <button class="report-button" onclick="openHWSRData()">
            HWSR DATA
        </button>

        <button class="upper-air-button" onclick="openUpperAirMonthly()">
            UPPER AIR MONTHLY
        </button>

    </div>

</div>

<div class="footer">
    <i><b>Charan</b></i>
</div>

<script>

    function getTodayDate() {

        const today = new Date();

        const day =
            String(today.getDate()).padStart(2, '0');

        const month =
            String(today.getMonth() + 1).padStart(2, '0');

        const year =
            today.getFullYear();

        return `${day}.${month}.${year}`;
    }


    function openCompose(recipients, subject, body) {

        body = body
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/\n/g, "\r\n");

        const gmailURL =
            "https://mail.google.com/mail/?" +
            "view=cm" +
            "&fs=1" +
            "&to=" + encodeURIComponent(recipients) +
            "&su=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);

        window.open(gmailURL, "_blank");
    }


    function openGmail(observationTime) {

        const today = new Date();

        const day =
            String(today.getDate()).padStart(2, '0');

        const date =
            getTodayDate();

        const body =
`AAXX ${day}${observationTime}4
43150  =`;

        const recipients =
            "amsschennai@gmail.com," +
            "apdata2021@gmail.com," +
            "MCAMARAVATI.WS@imd.gov.in";

        const subject =
            `${observationTime}Z SYNOP OF CWCVSK (43150) DATED ${date}`;

        openCompose(
            recipients,
            subject,
            body
        );
    }


    function openPPBB(observationTime) {

        const today = new Date();

        const day =
            String(today.getDate()).padStart(2, '0');

        const date =
            getTodayDate();

        const reason =
            observationTime === "06"
                ? "NO ASCENT DUE TO LOW CLOUDS"
                : "NO ASCENT DUE TO NO LANTERENS";

        const body =
`PPBB ${day}${observationTime}/
43150 900// 00000 ${reason}=`;

        const recipients =
            "amsschennai@gmail.com," +
            "apdata2021@gmail.com," +
            "MCAMARAVATI.WS@imd.gov.in";

        const subject =
            `${observationTime}Z PILOT OF CWCVSK (43150) DATED ${date}`;

        openCompose(
            recipients,
            subject,
            body
        );
    }


    function openSynopPilot(observationTime) {

        const today = new Date();

        const day =
            String(today.getDate()).padStart(2, '0');

        const date =
            getTodayDate();

        const recipients =
            "amsschennai@gmail.com," +
            "apdata2021@gmail.com," +
            "MCAMARAVATI.WS@imd.gov.in";

        if (observationTime === "06") {

            const body =
`AAXX ${day}064
43150

PPBB ${day}06/
43150 900// 00000 NO ASCENT DUE TO LOW CLOUDS=`;

            const subject =
                `06Z SYNOP & PILOT OF CWCVSK (43150) DATED ${date}`;

            openCompose(
                recipients,
                subject,
                body
            );
        }

        else if (observationTime === "18") {

            const body =
`AAXX ${day}184
43150

PPBB ${day}18/
43150 900// 00000 NO ASCENT DUE TO NO LANTERENS=`;

            const subject =
                `18Z SYNOP & PILOT OF CWCVSK (43150) DATED ${date}`;

            openCompose(
                recipients,
                subject,
                body
            );
        }
    }


    function openDailyWeatherParameters() {

        const subject =
            `DAILY WEATHER PARAMETERS OF CWC VSK DATED ${getTodayDate()}`;

        openCompose(
            "mc.amaravati@gmail.com",
            subject,
            "KFA=="
        );
    }


    function openHWSRData() {

        const subject =
            `HWSR DATA OF CWC VSK (43150) DATED ${getTodayDate()}`;

        openCompose(
            "cwcvsk@gmail.com",
            subject,
            "KFA=="
        );
    }


    function openUpperAirMonthly() {

        const today = new Date();

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth() - 1,
                1
            );

        const monthName =
            previousMonth.toLocaleString(
                'en-US',
                {
                    month: 'long'
                }
            );

        const year =
            previousMonth.getFullYear();

        const subject =
            `MONTHLY UPPER AIR DATA OF CWCVSK(43150) FOR THE MONTH OF ${monthName.toUpperCase()}- ${year}`;

        const body =
`Sir/Madam,
Kindly find the following attachments :

1. Balloon ascent data 06Z
2. Balloon ascent data 18 Z
3. PBO Ascent duration (06z & 18z)
4. A Table for Frequency of low cloud height.

Upper Air Monthly report (06z & 18z) could not be generated in the HHDL Processing window as the year ${year} slot is not available to generate the same. This Office requests to update the years beyond 2025 to generate the data in future.`;

        const recipients =
            "cs.rmc.chennai@gmail.com," +
            "dataual@yahoo.co.in," +
            "ddgmsi@imd.gov.in," +
            "apdata2021@gmail.com," +
            "mcamaravati.ws@imd.gov.in," +
            "dataual@gmail.com," +
            "pbochennai@gmail.com";

        openCompose(
            recipients,
            subject,
            body
        );
    }

</script>

</body>
</html>
